spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartjarvis}
    username: ${DATABASE_USERNAME:jarvis}
    password: ${DATABASE_PASSWORD:jarvis_secret_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: api-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jarvis_redis_2024}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Server Configuration
server:
  port: ${API_GATEWAY_PORT:8080}
  servlet:
    context-path: /api/v1

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    com.smartjarvis: ${LOG_LEVEL:INFO}
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
    expiration: ${JWT_EXPIRATION:86400}
    issuer: smartjarvis

# External Services
external:
  services:
    voice-gateway:
      url: http://localhost:8081
    stt-service:
      url: http://localhost:8082
    nlu-service:
      url: http://localhost:8083
    dm-service:
      url: http://localhost:8084
    tts-service:
      url: http://localhost:8085
    todo-service:
      url: http://localhost:8086
    calendar-service:
      url: http://localhost:8087
    money-service:
      url: http://localhost:8088
    memory-service:
      url: http://localhost:8089
    device-agent:
      url: http://localhost:8090
    home-bridge:
      url: http://localhost:8091

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      voice-gateway:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
      stt-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
  retry:
    instances:
      voice-gateway:
        max-attempts: 3
        wait-duration: 1s
      stt-service:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    instances:
      voice-gateway:
        timeout-duration: 5s
      stt-service:
        timeout-duration: 5s
