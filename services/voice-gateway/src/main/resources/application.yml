spring:
  application:
    name: voice-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database configuration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/smartjarvis}
    username: ${POSTGRES_USERNAME:jarvis}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis configuration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:secret}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry:
      url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${spring.kafka.schema-registry.url}
        acks: all
        retries: 3
        batch.size: 16384
        linger.ms: 5
        compression.type: snappy
        enable.idempotence: true

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: voice-gateway
      version: 1.0.0-SNAPSHOT

# Logging configuration
logging:
  level:
    com.smartjarvis: ${LOG_LEVEL:INFO}
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# OpenTelemetry configuration
otel:
  service:
    name: voice-gateway
  exporter:
    jaeger:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:14250}
  traces:
    exporter: jaeger

# Custom application properties
smartjarvis:
  voice-gateway:
    websocket:
      max-sessions: 1000
      max-message-size: 1048576  # 1MB
      heartbeat-interval: 30000  # 30 seconds
    audio:
      max-duration: 30  # seconds
      supported-formats:
        - pcm_16khz
        - pcm_8khz
    security:
      cors:
        allowed-origins: "*"  # TODO: configure for production
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
        allowed-headers: "*"

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/smartjarvis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: kafka:29092
    schema-registry:
      url: http://schema-registry:8081

otel:
  exporter:
    jaeger:
      endpoint: http://jaeger:14250

---
# Test profile  
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

logging:
  level:
    com.smartjarvis: DEBUG
