spring:
  application:
    name: dm-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Kafka configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry:
      url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      group-id: dm-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${spring.kafka.schema-registry.url}
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${spring.kafka.schema-registry.url}
        acks: all
        retries: 3
        enable.idempotence: true

# Server configuration
server:
  port: ${SERVER_PORT:8084}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: dm-service

# Logging
logging:
  level:
    com.smartjarvis: ${LOG_LEVEL:INFO}
    org.springframework.kafka: WARN

# Custom DM configuration
smartjarvis:
  dm:
    default-response: "Не понял команду"
    confirmation-timeout: 30000  # 30 seconds
    max-decision-time: 5000      # 5 seconds

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: kafka:29092
    schema-registry:
      url: http://schema-registry:8081
