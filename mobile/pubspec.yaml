name: smartjarvis_mobile
description: SmartJARVIS Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP клиент
  dio: ^5.3.2
  
  # State management
  provider: ^6.0.5
  
  # UI компоненты
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^7.0.7296
  
  # Аудио
  record: ^5.0.4
  audioplayers: ^5.2.1
  
  # Утилиты
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
