global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SmartJARVIS Services
  - job_name: 'smartjarvis-services'
    static_configs:
      - targets: 
        - 'host.docker.internal:8080'  # API Gateway
        - 'host.docker.internal:8081'  # Voice Gateway
        - 'host.docker.internal:8082'  # STT Service
        - 'host.docker.internal:8083'  # NLU Service
        - 'host.docker.internal:8084'  # DM Service
        - 'host.docker.internal:8085'  # TTS Service
        - 'host.docker.internal:8086'  # Todo Service
        - 'host.docker.internal:8087'  # Calendar Service
        - 'host.docker.internal:8088'  # Money Service
        - 'host.docker.internal:8089'  # Memory Service
        - 'host.docker.internal:8090'  # Device Agent
        - 'host.docker.internal:8091'  # Home Bridge
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  # Infrastructure Services
  - job_name: 'infrastructure'
    static_configs:
      - targets:
        - 'kafka:9092'
        - 'postgres:5432'
        - 'mongodb:27017'
        - 'redis:6379'
        - 'elasticsearch:9200'
    scrape_interval: 60s
