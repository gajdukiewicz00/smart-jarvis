name: smartjarvis_flutter_common
description: SmartJARVIS Common Flutter Utilities
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP клиент
  dio: ^5.3.2
  
  # JSON
  json_annotation: ^4.8.1
  
  # Утилиты
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
