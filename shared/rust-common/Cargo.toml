[package]
name = "smartjarvis-rust-common"
version = "0.1.0"
edition = "2021"
description = "SmartJARVIS Common Rust Utilities"
authors = ["SmartJARVIS Team"]
license = "Proprietary"
repository = "https://github.com/smartjarvis/smart-jarvis"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
