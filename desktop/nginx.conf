server {
    listen 3000;
    listen 3443 ssl;
    server_name localhost;
    
    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to services
    location /api/ {
        proxy_pass http://smartjarvis-voice-gateway-2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service health proxy (avoids CORS)
    location /svc/voice-gateway {
        proxy_pass http://smartjarvis-voice-gateway-2:8080/actuator/health;
        proxy_set_header Host $host;
    }
    location /svc/stt-service {
        proxy_pass http://stt-service:8082/health;
        proxy_set_header Host $host;
    }
    location /svc/nlu-service {
        proxy_pass http://nlu-service:8083/actuator/health;
        proxy_set_header Host $host;
    }
    location /svc/dm-service {
        proxy_pass http://dm-service:8084/actuator/health;
        proxy_set_header Host $host;
    }
    location /svc/tts-service {
        proxy_pass http://tts-service:8085/health;
        proxy_set_header Host $host;
    }
    location /svc/todo-service {
        proxy_pass http://todo-service:8086/actuator/health;
        proxy_set_header Host $host;
    }
    location /svc/device-agent {
        proxy_pass http://device-agent:8087/actuator/health;
        proxy_set_header Host $host;
    }
    location /svc/home-bridge {
        return 503 "Service temporarily unavailable";
    }

    # WebSocket proxy for voice connection
    location /voice {
        proxy_pass http://smartjarvis-voice-gateway-2:8080/voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
